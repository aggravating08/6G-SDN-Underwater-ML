name: Project CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Simulator and ML pipeline
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate Python and canonical dataset
        run: |
          python -m compileall -q underwater_ml_pipeline.py
          python - <<'PY'
          import pandas as pd
          from underwater_ml_pipeline import PROJECT_DATASET, validate_long_dataset

          data = pd.read_csv(PROJECT_DATASET)
          validate_long_dataset(data)
          assert len(data) == 8_000
          assert data["scenario_id"].nunique() == 2_000
          print("Validated 8,000 candidate rows across 2,000 scenarios.")
          PY

      - name: Configure the required ns-3 modules
        run: >-
          ./ns3 configure
          --build-profile=release
          --enable-modules="core;network;mobility"
          --disable-examples
          --disable-tests
          --disable-precompiled-headers
          --disable-werror
          -G Ninja

      - name: Build the underwater simulator
        run: ./ns3 build randy

      - name: Run a deterministic simulator smoke test
        run: |
          mkdir -p /tmp/underwater-ci
          ./ns3 run "scratch/randy --mode=labels --nodeCount=25 --runs=2 --baseSeed=29 --output=/tmp/underwater-ci/labels.csv"
          python - <<'PY'
          import pandas as pd

          data = pd.read_csv("/tmp/underwater-ci/labels.csv")
          assert len(data) == 8
          assert data["scenario_id"].nunique() == 2
          assert data.groupby("scenario_id")["is_oc"].sum().eq(1).all()
          print("Simulator smoke test produced two valid four-candidate scenarios.")
          PY
